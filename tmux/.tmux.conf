# run zsh as a default shell
set-option -g default-shell $SHELL

# remap prefix from 'C-b' to 'C-a'
unbind C-b
set-option -g prefix C-a
bind C-a send-prefix

# reload config file with 'prefix-r'
bind r source-file ~/.tmux.conf

# switch panes using alt-arrow and alt-(hjkl) without prefix,
# stop at the edge instead of wrapping around to the other side
bind -n M-Left if -F '#{?pane_at_left,,1}' 'select-pane -L'
bind -n M-Right if -F '#{?pane_at_right,,1}' 'select-pane -R'
bind -n M-Up if -F '#{?pane_at_top,,1}' 'select-pane -U'
bind -n M-Down if -F '#{?pane_at_bottom,,1}' 'select-pane -D'
bind -n M-h if -F '#{?pane_at_left,,1}' 'select-pane -L'
bind -n M-j if -F '#{?pane_at_bottom,,1}' 'select-pane -D'
bind -n M-k if -F '#{?pane_at_top,,1}' 'select-pane -U'
bind -n M-l if -F '#{?pane_at_right,,1}' 'select-pane -R'

# use vi keys in copy mode
setw -g mode-keys vi

# send every copy (mouse drag and 'y') to the system clipboard, gnome-terminal ignores OSC 52
set -s copy-command "xclip -r -selection clipboard"

# use 'v' to start selection and 'y' to copy to the system clipboard
bind-key -T copy-mode-vi 'v' send -X begin-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-pipe

# shift + arrows to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# alt + n/m to switch windows
bind -n M-v previous-window
bind -n M-n next-window

# unable switching using esc
set -s escape-time 0

# split panes using a and v
unbind '"'
unbind %
bind a split-window -v
bind v split-window -h

# enable mouse mode
set -g mouse on

# don't rename windows automatically
set-option -g allow-rename off

# switch to previous window using ctrl + b
bind b previous-window

# workmux worktrees list in a popup, enter opens or reattaches the worktree session
bind w display-popup -E -w 80% -h 70% "workmux dashboard --tab worktrees"

# toggle workmux agent sidebar (replaces clock-mode), started by the server so it outlives any pane
bind t run-shell -b "workmux sidebar"

### design

# use 256 color
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc"

# borders
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour208
set -g pane-border-lines heavy
# color the whole shared border, not half of it, when there are two panes
set -g pane-border-indicators off

# dim inactive panes so the active one stands out (tmux can't outline window edges)
set -g window-style 'fg=colour245,bg=colour234'
set -g window-active-style 'fg=terminal,bg=terminal'

# windows
setw -g window-status-format "#[bg=colour247]#[fg=colour15] #I #[bg=colour8]#[fg=colour15] #W "
setw -g window-status-current-format "#[bg=colour208]#[fg=colour15] #I #[bg=colour8]#[fg=colour15] #W "

# be silent
set-option -g visual-activity off
set-option -g visual-bell off
set-option -g visual-silence off
set-window-option -g monitor-activity off
set-option -g bell-action none

# status bar
set -g status-position bottom
set -g status-justify left
set -g status-interval 1
set -g status-bg colour234
set -g status-fg colour208
set -g status-right '#[bg=colour241,fg=colour15] %d/%m #[bg=colour245,fg=colour15] %H:%M '
set -g status-left ''
set -g message-style fg=colour15
set -g message-style bg=colour234
