# workmux global config - project-level .workmux.yaml overrides these
# docs: https://github.com/raine/workmux#configuration

nerdfont: true

# claude profiles like the claude-work/claude-personal aliases, `workmux add -a claude-personal`
# picks the personal one, `wmx personal` sets WMX_CLAUDE_CONFIG_DIR while opening
# (string commands go through a shell, env values of structured profiles don't expand ~ or $HOME)
agents:
  claude-work: "env CLAUDE_CONFIG_DIR=${WMX_CLAUDE_CONFIG_DIR:-$HOME/.claude-work} claude"
  claude-personal: "env CLAUDE_CONFIG_DIR=$HOME/.claude-personal claude"
agent: claude-work

# merge_strategy: rebase           # merge | rebase | squash (default: merge)
# merge_keep: true                 # keep worktree, window and branch after `workmux merge`
# confirm_unmerged_removal: false  # skip confirmation when removing unmerged branches

# share env files with the main checkout instead of copying them
files:
  symlink:
    - .env*

# symlink gitignored .env* files from app subfolders (monorepos), `ws` runs it again
post_create:
  - ~/dotfiles/tmux/workmux/link-env.sh

# session per worktree, named after the worktree directory like `tp` does,
# so run-beside/run-in-editor from tmux/helpers.sh find it
mode: session
window_prefix: ''

# same layout as `tp`: editor on top, shell and agent below
panes:
  - command: $VISUAL todo.yml
    focus: true
  - split: vertical
    percentage: 30
  - command: <agent>
    split: horizontal
