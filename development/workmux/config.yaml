# workmux global config - project-level .workmux.yaml overrides these
# docs: https://github.com/raine/workmux#configuration

nerdfont: true
agent: claude

# merge_strategy: rebase           # merge | rebase | squash (default: merge)
# merge_keep: true                 # keep worktree, window and branch after `workmux merge`
# confirm_unmerged_removal: false  # skip confirmation when removing unmerged branches

# session per worktree, named after the worktree directory like `tp` does,
# so run-beside/run-in-editor from tmux/helpers.sh find it
mode: session
window_prefix: ''

# same layout as `tp`: editor on top, shell and agent below
panes:
  - command: $VISUAL todo.yml
    focus: true
  - split: vertical
    percentage: 30
  - command: <agent>
    split: horizontal
